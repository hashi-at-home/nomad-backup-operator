name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  buildpack:
    name: Buildpack
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Dev Env
        uses: jdx/mise-action@v5
        with:
          install: true
      - id: package
        name: Build Container
        run: pack \
          build \
          ghcr.io/hashi-at-home/nomad-operator \
          --path . \
          --builder paketobuildpacks/builder-jammy-tiny
