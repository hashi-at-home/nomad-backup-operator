---
branches:
  - main
plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/changelog"
  - "@semantic-release/release-notes-generator"
  - - "@semantic-release/github"
    - assets:
        - path: nomad-operator-linux-amd64
          label: nomad-operator-linux-amd64
        - path: nomad-operator-linux-arm64
          label: nomad-operator-linux-arm64
        - path: nomad-operator-linux-arm
          label: nomad-operator-linux-arm
  - - "@semantic-release/git"
    - assets: ["CHANGELOG.md"]
